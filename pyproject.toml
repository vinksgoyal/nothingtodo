[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nothingtodo"
version = "0.1.0"
description = "A local-first assistant for turning unstructured input into actionable tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "pydantic>=2",
    "pytesseract",
    "pillow",
    "piper-tts",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "rich",
]

[tool.setuptools.packages.find]
include = ["core*", "eval*", "scripts*"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
